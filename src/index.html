<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akashic Records</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <canvas id="field" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>

    <header class="titlebar">
      <div class="titlebar-brand">
        <span class="sigil" aria-hidden="true"></span>
        <span class="titlebar-name">Akashic Records</span>
      </div>
      <div class="titlebar-status">
        <span id="veil-chip" class="chip">Veil Intact</span>
        <span id="provider-chip" class="chip mute">Ollama Cloud</span>
      </div>
      <div class="titlebar-actions">
        <button id="btn-seek" class="ghost" type="button" title="Seek the Records">Seek</button>
        <button id="btn-new" class="ghost" type="button" title="New session">New</button>
        <button id="btn-settings" class="ghost icon" type="button" title="Attunement / Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6z" />
            <path d="M12 2.8v1.8M12 19.4v1.8M2.8 12h1.8M19.4 12h1.8M5.1 5.1l1.3 1.3M17.6 17.6l1.3 1.3M18.9 5.1l-1.3 1.3M6.4 17.6l-1.3 1.3" />
          </svg>
        </button>
        <div class="win-btns">
          <button id="win-min" type="button" aria-label="Minimize">—</button>
          <button id="win-max" type="button" aria-label="Maximize">□</button>
          <button id="win-close" type="button" aria-label="Close">×</button>
        </div>
      </div>
    </header>

    <main id="stage">
      <section id="boot" class="boot">
        <p id="boot-title" class="boot-title"></p>
        <p id="boot-sub" class="boot-sub"></p>
      </section>

      <div id="thread" class="thread" hidden></div>

      <div class="resonance-wrap" id="resonance-wrap" hidden>
        <div class="resonance-meta">
          <span>Resonance</span>
          <span id="resonance-val">00</span>
        </div>
        <div class="resonance-bar"><i id="resonance-fill"></i></div>
      </div>
    </main>

    <footer class="composer-wrap" id="composer-wrap" hidden>
      <form id="composer" autocomplete="off">
        <label class="sr-only" for="prompt">Speak into the static</label>
        <textarea
          id="prompt"
          rows="1"
          placeholder="Speak into the static…"
          maxlength="12000"
        ></textarea>
        <button id="btn-send" type="submit" title="Send">
          <span>Inquire</span>
        </button>
      </form>
      <p class="hint" id="hint">The noise is listening. Meaning has not yet chosen you.</p>
    </footer>

    <aside id="settings" class="settings" hidden>
      <div class="settings-head">
        <h2>Attunement</h2>
        <button id="btn-settings-close" class="ghost icon" type="button" aria-label="Close settings">×</button>
      </div>
      <p class="settings-lead">Choose a voice. The records do not care which throat they use — only that it is true.</p>

      <div class="field">
        <label>Provider</label>
        <div class="provider-grid" id="provider-grid"></div>
      </div>

      <div class="field">
        <label for="model-select">Model</label>
        <div class="row">
          <select id="model-select"></select>
          <button id="btn-refresh-models" class="ghost" type="button">Refresh</button>
        </div>
      </div>

      <div class="field" id="custom-model-field">
        <label for="custom-model">Custom model id</label>
        <input id="custom-model" type="text" placeholder="optional override" />
      </div>

      <div class="field" id="key-field">
        <label id="key-label" for="api-key">API key</label>
        <input id="api-key" type="password" placeholder="Paste a key to attune" autocomplete="off" />
      </div>

      <div class="field" id="local-url-field" hidden>
        <label for="ollama-url">Ollama local URL</label>
        <input id="ollama-url" type="text" placeholder="http://127.0.0.1:11434" />
      </div>

      <div class="field" id="custom-url-field" hidden>
        <label for="custom-url">OpenAI-compatible base URL</label>
        <input id="custom-url" type="text" placeholder="https://api.example.com/v1" />
      </div>

      <div class="field split">
        <div>
          <label for="temperature">Temperature <span id="temp-val">0.85</span></label>
          <input id="temperature" type="range" min="0" max="1.5" step="0.05" value="0.85" />
        </div>
        <label class="check">
          <input id="think" type="checkbox" />
          <span>Thinking (Ollama)</span>
        </label>
      </div>

      <button id="btn-save-settings" class="solid" type="button">Seal attunement</button>
      <p class="settings-foot" id="settings-status"></p>
    </aside>
    <div id="settings-mask" class="mask" hidden></div>

    <script src="js/visual.js"></script>
    <script src="js/dllm.js"></script>
    <script src="js/records.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
