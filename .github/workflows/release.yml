name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: dist:win
          - os: macos-latest
            command: dist:mac
          - os: ubuntu-latest
            command: dist:linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag against package.json
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          node -e "const v=require('./package.json').version; if ('v'+v !== process.env.GITHUB_REF_NAME) { console.error('Tag '+process.env.GITHUB_REF_NAME+' does not match package version '+v); process.exit(1) }"

      - run: npm ci

      - run: npm test

      - name: Package
        run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${version}"
          fi
          mapfile -d '' files < <(find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installers found to publish."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            {
              echo "## Akashic Records ${version}"
              echo
              echo "An Electron oracle. Speak into DLLM static until the veil thins and the records open."
              echo
              echo "These builds are unsigned. Windows SmartScreen and macOS Gatekeeper will ask you to confirm the app before it opens. On macOS, right-click the app and choose Open."
              echo
              echo "### Downloads"
              echo
              echo '```'
              find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) -printf '%f\n' | sort
              echo '```'
            } > notes.md
            gh release create "$tag" "${files[@]}" \
              --title "Akashic Records ${version}" \
              --notes-file notes.md
          fi
          body="$(gh release view "$tag" --json body --jq .body)"
          if ! printf '%s' "$body" | grep -q "unsigned"; then
            {
              printf '%s\n\n' "$body"
              echo "These builds are unsigned. Windows SmartScreen and macOS Gatekeeper will ask you to confirm the app before it opens. On macOS, right-click the app and choose Open."
            } > notes.md
            gh release edit "$tag" --notes-file notes.md
          fi
          gh release view "$tag" --json url --jq .url
